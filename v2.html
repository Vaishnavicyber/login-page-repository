<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign account</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
     body{
        height: 100vh;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to right,lightgreen, white,lightgreen,white,lightgreen,lightgreen,white);
         
        
    }
    form{
        width:30vw;
        height:70vh;
        display:flex;
        flex-direction:column;
        margin-top:20px;
        margin-bottom:20px;
         background:linear-gradient(to right,lightgreen, white,lightgreen,white,lightgreen,lightgreen,white);
        box-shadow: 0 8px 32px black;
        border-radius: 10px 30px 60px;
        
    }
    h1{
        font-size: 30px;
        text-align: center;
        letter-spacing: 3px;
        margin-top: 5%;
        opacity: .7;
margin-bottom: 0px;
text-shadow: 2px 2px 4px white;
    }
    label{
        font-size: 20px;
       display:block;
       text-align:left;
       margin-bottom: 5px;
       padding: 0% 10px;
       margin-left: 30px;
       margin-top: 10px;
        text-shadow:2px 2px 4px whitesmoke ;
    }
 
    input{
        background: transparent;
        width: 80%;
        margin-left: 30px;
        opacity: .8;
        outline: none;
         border: none;
        border-bottom: 1px solid whitesmoke;
    }
    h2{
       font-size: 15px;
       padding: 5px 10px;
       margin: 0px;
       content: none;
        text-align: center;
        text-shadow: 2px 2px 4px white;
        letter-spacing: 3px;
        margin-top: 5px;
        opacity: .7;

    }
    button{
        width: 50%;
        margin: 2% auto;
        color: white;
        font-size: 15px;
        opacity: .7;
        background:linear-gradient(to right,black, green, black,green,black);
        padding: 10px 30px;
        border: none;
        outline: none;
        box-shadow: 3px 3px 5px rgb(28, 44,180, 40);
        border-radius: 10px 60px 30px;
        text-shadow: 2px 2px 4px rgba(255, 255 ,255 ,0.2);
    }
    .google{
        width: 50%;
        display:flex;
        justify-content:center;
        align-items:center;
        margin-bottom: 10px;
         margin-top: -11px;
         
    }
    .github{
        width: 50%;
        display:flex;
        justify-content:center;
        align-items:center;
         margin-top: -6px;
    
    }
    a{
        text-align:center;
        margin-top: 10px;
    }
    h6{
        text-align: center;
        margin-top: -4px;
    }
   
</style>

<body>
    <form>
    <h1>welcome </h1>
    <h2>sign in your account</h2>
    <label>username</label>
    <input type="text">
    <label>Email</label>
    <input type="email" id="email" name="email" required>
    <label>Password </label>
    <input type="password" id="password" name="password" required>
<a href="#">forget password?</a>

    <button type="submit">Sign In</button>
    <h6>-----------or continur with----------</h6>
    <button class="google" type="google"> Google</button>
    <button class="github"type="github"> GitHub</button>
    </form>
</body>
</html>
